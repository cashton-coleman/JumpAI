[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jumpai"
version = "0.1.2"
description = "A local, reusable program catalog for coding agents"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jumpai = "jumpai.cli:main"

[tool.setuptools.packages.find]
include = ["jumpai*"]
